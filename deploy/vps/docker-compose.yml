services:
  # ---------------------------------------------------------------------------
  # Nginx API (reverse proxy FastCGI -> PHP-FPM)
  # ---------------------------------------------------------------------------
  api:
    image: ${DOCKERHUB_USERNAME}/devsecvault-api:latest
    container_name: dsv-api
    restart: unless-stopped
    depends_on:
      - php
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal
      - nginx-reverse-proxy

  # ---------------------------------------------------------------------------
  # PHP-FPM (Symfony 8)
  # ---------------------------------------------------------------------------
  php:
    image: ${DOCKERHUB_USERNAME}/devsecvault-backend:latest
    container_name: dsv-php
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dsv-postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      APP_ENV: "prod"
      APP_SECRET: "${APP_SECRET}"
      KEYCLOAK_URL: "https://auth.calixteair.fr"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
      MEILI_URL: "http://dsv-meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      CORS_ALLOW_ORIGIN: "^https://vault\\.calixteair\\.fr$$"
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal

  # ---------------------------------------------------------------------------
  # Angular (production build served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    image: ${DOCKERHUB_USERNAME}/devsecvault-frontend:latest
    container_name: dsv-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx-reverse-proxy

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dsv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal

  # ---------------------------------------------------------------------------
  # Meilisearch
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: dsv-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_ENV: "production"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal

volumes:
  postgres_data:
    driver: local
  meili_data:
    driver: local

networks:
  dsv-internal:
    driver: bridge
    internal: true
  nginx-reverse-proxy:
    external: true
