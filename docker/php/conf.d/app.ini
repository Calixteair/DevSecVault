; =============================================================================
; DevSecVault - PHP Configuration
; =============================================================================

[PHP]
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
date.timezone = UTC

; Realpath cache (improves autoloader performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

; Dev-friendly: revalidate on every request so code changes take effect immediately
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; Preloading disabled in dev (enable in production with a preload script)
; opcache.preload =
; opcache.preload_user = www-data
