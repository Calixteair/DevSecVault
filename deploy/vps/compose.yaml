services:
  # ---------------------------------------------------------------------------
  # Nginx API (reverse proxy FastCGI -> PHP-FPM)
  # ---------------------------------------------------------------------------
  api:
    image: registry.calixteair.fr/devsecvault/devsecvault:api-latest
    container_name: dsv-api
    restart: unless-stopped
    depends_on:
      - php
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal
      - nginx-reverse-proxy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "24"

  # ---------------------------------------------------------------------------
  # PHP-FPM (Symfony 8)
  # ---------------------------------------------------------------------------
  php:
    image: registry.calixteair.fr/devsecvault/devsecvault:backend-latest
    container_name: dsv-php
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dsv-postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      APP_ENV: "prod"
      APP_SECRET: "${APP_SECRET}"
      ENCRYPTION_KEY: ""
      KEYCLOAK_URL: "https://auth.calixteair.fr"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
      MEILI_URL: "http://dsv-meilisearch:7700"
      MEILI_PUBLIC_URL: "https://vaultapi.calixteair.fr/meili"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      CORS_ALLOW_ORIGIN: '^https://vault\.calixteair\.fr$$'
      MAILER_DSN: "${MAILER_DSN}"
      REPORT_NOTIFY_FROM: "${REPORT_NOTIFY_FROM}"
      REPORT_NOTIFY_TO: "${REPORT_NOTIFY_TO}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL}"
      REPORT_IP_HASH_SALT: "${REPORT_IP_HASH_SALT}"
    volumes:
      - /run/devsecvault/prod.decrypt.private.php:/var/www/backend/config/secrets/prod/prod.decrypt.private.php:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal
      - nginx-reverse-proxy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "24"

  # ---------------------------------------------------------------------------
  # Angular (production build served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    image: registry.calixteair.fr/devsecvault/devsecvault:frontend-latest
    container_name: dsv-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx-reverse-proxy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "24"

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dsv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal

  # ---------------------------------------------------------------------------
  # Meilisearch
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: dsv-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_ENV: "production"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    security_opt:
      - no-new-privileges:true
    networks:
      - dsv-internal
      - nginx-reverse-proxy

volumes:
  postgres_data:
    driver: local
  meili_data:
    driver: local

networks:
  dsv-internal:
    driver: bridge
    internal: true
  nginx-reverse-proxy:
    external: true
