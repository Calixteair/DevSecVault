# Rate-limit zone shared across api locations (10 req/s per IP, 10 MB state).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;

    # Cap request body to 2 MB (covers 1 MB ciphertext + headers).
    client_max_body_size 2M;

    # Security headers (mirrored from frontend, narrower scope here).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Apply rate-limit on every request reaching PHP-FPM.
        limit_req zone=api_general burst=20 nodelay;

        fastcgi_pass dsv-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
