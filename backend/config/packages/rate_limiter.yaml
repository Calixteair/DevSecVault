framework:
    rate_limiter:
        # PAT-authenticated requests: 60 calls per minute per token (rolling window).
        # Storage: cache.app (filesystem by default — fine for single-instance VPS).
        api_token:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Lot 4 — moderation report submissions: 5 per hour per IP.
        # Keyed on the client IP (hashed only at storage time, never logged).
        report_submit:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
